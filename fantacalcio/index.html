<title>Fantacalcio Serie A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f2f4ef; --surface:#ffffff; --surface-2:#e8ece4; --ink:#16201a; --muted:#5a665d; --line:#d3dace;
  --accent:#1d6b43; --accent-2:#e3f0e8; --accent-ink:#ffffff;
  --pitch:#1f7a4a; --pitch-2:#23874f; --chalk:rgba(255,255,255,.55);
  --rP:#d9950b; --rD:#23924f; --rC:#2766cf; --rA:#cc3b33;
  --good:#1c8748; --warn:#b77c07; --bad:#c3352b; --good-bg:#dff1e5; --warn-bg:#f8edcf; --bad-bg:#f8e0dd;
  --shadow:0 1px 2px rgba(20,40,25,.06),0 6px 20px rgba(20,40,25,.06);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1310; --surface:#151c17; --surface-2:#1c2520; --ink:#e4ebe5; --muted:#98a59b; --line:#2a352e;
    --accent:#4cc184; --accent-2:#1a3326; --accent-ink:#08170f;
    --pitch:#175c38; --pitch-2:#1a6640; --chalk:rgba(255,255,255,.35);
    --rP:#f0b43a; --rD:#46c07a; --rC:#5b93ee; --rA:#ee6a61;
    --good:#4cc184; --warn:#e5b04a; --bad:#f07268; --good-bg:#173424; --warn-bg:#3a2f14; --bad-bg:#3d1c19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1310; --surface:#151c17; --surface-2:#1c2520; --ink:#e4ebe5; --muted:#98a59b; --line:#2a352e;
  --accent:#4cc184; --accent-2:#1a3326; --accent-ink:#08170f;
  --pitch:#175c38; --pitch-2:#1a6640; --chalk:rgba(255,255,255,.35);
  --rP:#f0b43a; --rD:#46c07a; --rC:#5b93ee; --rA:#ee6a61;
  --good:#4cc184; --warn:#e5b04a; --bad:#f07268; --good-bg:#173424; --warn-bg:#3a2f14; --bad-bg:#3d1c19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.55rem}
h3{font-size:1.2rem}
.num,td,.kpi b{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font-size:1.7rem;line-height:1}
.brand h1 span{color:var(--accent)}
.stat-strip{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:.85rem;white-space:nowrap}
.pill b{font-family:var(--display);font-size:1.05rem}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:8px 12px 10px;font-family:var(--display);font-size:1.08rem;font-weight:600;letter-spacing:.02em;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:2.1rem;line-height:1.05;font-weight:700}
.kpi .sub{font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0}
input[type=number]{width:84px}
textarea{width:100%;min-height:130px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
.field{display:flex;flex-direction:column;gap:4px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.role{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-family:var(--display);font-weight:700;font-size:.95rem;color:#fff;flex:none}
.role.P{background:var(--rP)}.role.D{background:var(--rD)}.role.C{background:var(--rC)}.role.A{background:var(--rA)}
.team{font-family:var(--display);font-weight:600;font-size:.85rem;letter-spacing:.04em;color:var(--muted)}
.fv{display:inline-block;min-width:38px;text-align:center;border-radius:5px;padding:1px 5px;font-weight:700;font-variant-numeric:tabular-nums}
.fv.hi{background:var(--good-bg);color:var(--good)}
.fv.mid{background:var(--surface-2)}
.fv.lo{background:var(--bad-bg);color:var(--bad)}
.fv.sv{color:var(--muted)}
.st{font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em}
.st.inf{background:var(--bad-bg);color:var(--bad)}
.st.squ{background:var(--warn-bg);color:var(--warn)}
.st.dub{background:var(--warn-bg);color:var(--warn)}
.own{font-size:.8rem;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--surface-2);white-space:nowrap}
.own.me{background:var(--accent);color:var(--accent-ink)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;white-space:nowrap}
th.sortable{cursor:pointer}
th.sorted{color:var(--ink)}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.pname{font-weight:600}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.note{padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:.9rem}
.note.warn{background:var(--warn-bg)}
.note.bad{background:var(--bad-bg)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.ok{background:var(--good)}

/* pitch */
.pitch{position:relative;border-radius:12px;padding:18px 10px;display:flex;flex-direction:column;gap:18px;
  background:repeating-linear-gradient(180deg,var(--pitch) 0 48px,var(--pitch-2) 48px 96px);border:3px solid var(--chalk);min-height:420px;justify-content:space-around;overflow:hidden}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:110px;height:110px;border:2px solid var(--chalk);border-radius:50%;transform:translate(-50%,-50%)}
.pitch::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--chalk)}
.line{position:relative;z-index:1;display:flex;justify-content:space-evenly;gap:6px}
.slot{background:rgba(255,255,255,.94);color:#16201a;border-radius:8px;padding:5px 7px;width:min(112px,23%);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:1px;align-items:center}
.slot .n{font-weight:700;font-size:.82rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.slot .t{font-family:var(--display);font-size:.72rem;color:#5a665d;letter-spacing:.05em}
.slot .x{font-family:var(--display);font-weight:700;font-size:.95rem}
.slot.empty-slot{background:rgba(255,255,255,.2);color:#fff;border:1px dashed rgba(255,255,255,.7);box-shadow:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:3px 9px;cursor:pointer;font-weight:700;font-size:.82rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* heatmap */
.heat td{padding:4px 6px;text-align:center}
.heat td.pn{text-align:left}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,12,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(520px,100%);height:100%;overflow-y:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);padding-top:calc(20px + env(safe-area-inset-top,0px))}
.suggest{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.suggest button{border:0;background:none;text-align:left;padding:7px 10px;display:flex;gap:8px;align-items:center;cursor:pointer}
.suggest button+button{border-top:1px solid var(--line)}
.suggest button:hover,.suggest button:focus-visible{background:var(--surface-2)}
.bigprice{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1;color:var(--accent)}
.ai-out{white-space:pre-wrap;font-size:.94rem;line-height:1.5;max-height:420px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
details summary{cursor:pointer;font-weight:700;font-family:var(--display);font-size:1.1rem}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}
@media (max-width:560px){.kpi b{font-size:1.7rem}.brand h1{font-size:1.45rem}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Fanta<span>Serie A</span> <span class="muted" id="teamName" style="color:var(--muted);font-weight:600"></span></h1>
      <div class="stat-strip" id="strip"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<div class="wrap"><main id="main"></main></div>
<div id="drawerHost"></div>
<div id="toastHost"></div>

<script>
"use strict";
/* ---------- utilità ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const f1 = x => x == null || isNaN(x) ? "–" : (Math.round(x * 100) / 100).toFixed(2).replace(/0$/, "");
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const ROLES = ["P", "D", "C", "A"];
const ROLE_NAME = {P: "Portieri", D: "Difensori", C: "Centrocampisti", A: "Attaccanti"};
const MODULI = {"3-4-3":[3,4,3],"3-5-2":[3,5,2],"4-3-3":[4,3,3],"4-4-2":[4,4,2],"4-5-1":[4,5,1],"5-3-2":[5,3,2],"5-4-1":[5,4,1]};
const STATI = {ok: "Disponibile", dub: "In dubbio", inf: "Infortunato", squ: "Squalificato"};
const ME = "me";

const DEF_CONFIG = {
  nomeSquadra: "La mia squadra", crediti: 1000, partecipanti: 10,
  slot: {P: 3, D: 8, C: 8, A: 6}, perc: {P: 7, D: 18, C: 30, A: 45},
  bonus: {gol: 3, rig: 3, ass: 1, amm: -0.5, esp: -1, gs: -1, rp: 3, rs: -3, au: -2},
  rimborso: "quota", giornata: null
};

const S = {
  teams: {}, config: null, asta: null, mov: null, form: {},
  db: null, dbState: "loading", sample: null, loaded: {squadre: false, lega: false},
  tab: "panoramica",
  ui: {q: "", role: "", team: "", own: "", sort: "q", dir: -1, astaRole: "A", astaQ: "", astaPick: null,
       formG: null, mercQ: "", mercPick: null, storPid: null, manualG: null}
};
try { const t = localStorage.getItem("fanta.tab"); if (t) S.tab = t; } catch (e) {}

const cfg = () => ({...DEF_CONFIG, ...(S.config || {}), slot: {...DEF_CONFIG.slot, ...(S.config?.slot || {})}, perc: {...DEF_CONFIG.perc, ...(S.config?.perc || {})}, bonus: {...DEF_CONFIG.bonus, ...(S.config?.bonus || {})}});
const LISTONE_BASE = 500;
const scala = () => cfg().crediti / LISTONE_BASE;
const qv = p => Math.max(1, Math.round(p.q * scala()));
const asta = () => ({presi: {}, obiettivi: {}, avversari: [], ...(S.asta || {})});
const ops = () => (S.mov?.ops || []);

/* ---------- giocatori e statistiche ---------- */
let cacheKey = null, cache = null;
function players() {
  const key = S._ver;
  if (cache && cacheKey === key) return cache;
  const list = [];
  for (const [tid, t] of Object.entries(S.teams)) for (const p of (t.giocatori || [])) list.push(enrich(p, tid, t));
  list.sort((a, b) => b.q - a.q);
  const byId = {}; for (const p of list) byId[p.id] = p;
  cache = {list, byId}; cacheKey = key; return cache;
}
function enrich(p, tid, t) {
  const gs = Object.keys(p.v || {}).map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b);
  const ent = gs.map(g => ({g, ...p.v[g]}));
  const played = ent.filter(e => e.vo != null);
  const fvs = played.map(e => e.fv);
  const pv = played.length;
  const mv = avg(played.map(e => e.vo));
  const fm = avg(fvs);
  const last3 = fvs.slice(-3);
  const forma = avg(last3);
  const gol = played.reduce((s, e) => s + (e.gf || 0), 0);
  const ass = played.reduce((s, e) => s + (e.as || 0), 0);
  const base = p.r === "P" ? 5.6 + Math.min(p.q, 25) / 25 * 1.2 : 5.9 + Math.min(p.q, 35) / 35 * 2.4;
  let atteso = pv >= 2 ? 0.45 * forma + 0.35 * fm + 0.2 * base : pv === 1 ? 0.5 * fm + 0.5 * base : base;
  if (p.st === "dub") atteso -= 0.6;
  if (p.st === "inf" || p.st === "squ") atteso = 0;
  return {...p, tid, team: t.nome, sigla: t.sigla || tid, ent, pv, mv, fm, forma, gol, ass, atteso,
          trend: pv >= 4 ? forma - fm : null, spark: played.slice(-6)};
}
function owner(pid) { return asta().presi[pid] || null; }
function myPlayers() { const {byId} = players(); return Object.entries(asta().presi).filter(([, o]) => o.by === ME).map(([id, o]) => byId[id] && {...byId[id], prezzo: o.prezzo}).filter(Boolean); }
function maxG() { let m = 0; for (const p of players().list) for (const e of p.ent) m = Math.max(m, e.g); return m; }
function currentG() { return cfg().giornata || Math.max(1, maxG() + 1); }
function credits(by) { return cfg().crediti + ops().filter(o => o.by === by).reduce((s, o) => s + (o.delta || 0), 0); }
function vote(pid, g) { const p = players().byId[pid]; return p ? p.ent.find(e => e.g === g) || null : null; }
function fvClass(x) { return x == null ? "sv" : x >= 7 ? "hi" : x >= 6 ? "mid" : "lo"; }
function fvCell(e) { if (!e) return `<span class="fv sv">–</span>`; if (e.vo == null) return `<span class="fv sv">s.v.</span>`; return `<span class="fv ${fvClass(e.fv)}">${f1(e.fv)}</span>`; }
function roleTag(r) { return `<span class="role ${r}" title="${ROLE_NAME[r]}">${r}</span>`; }
function stTag(st) { return st && st !== "ok" ? `<span class="st ${st}">${st === "inf" ? "Inf" : st === "squ" ? "Squ" : "Dub"}</span>` : ""; }
function ownTag(pid) { const o = owner(pid); if (!o) return `<span class="own" style="background:none;color:var(--good)">Libero</span>`; return o.by === ME ? `<span class="own me">Mio · ${o.prezzo}</span>` : `<span class="own">${esc(o.by)} · ${o.prezzo}</span>`; }

/* prezzo consigliato: la quota riscalata sui crediti di tutta la lega per ruolo */
function priceModel() {
  const c = cfg(); const res = {};
  for (const r of ROLES) {
    const need = c.partecipanti * c.slot[r];
    const pool = players().list.filter(p => p.r === r).slice(0, need);
    const sumQ = pool.reduce((s, p) => s + p.q, 0) + Math.max(0, need - pool.length) || 1;
    const budget = c.crediti * c.partecipanti * c.perc[r] / 100;
    res[r] = {k: budget / sumQ, need, cut: pool.length ? pool[pool.length - 1].q : 1, rank: Object.fromEntries(pool.map((p, i) => [p.id, i]))};
  }
  return res;
}
function suggestPrice(p, pm = priceModel()) {
  const m = pm[p.r]; if (!m) return 1;
  if (!(p.id in m.rank)) return 1;
  return Math.max(1, Math.round(p.q * m.k));
}
function tier(p, pm = priceModel()) {
  const i = pm[p.r].rank[p.id]; const n = cfg().partecipanti;
  if (i == null) return {t: "Riserva", c: "muted"};
  if (i < n) return {t: "Top", c: "good"};
  if (i < n * 2) return {t: "Semitop", c: "good"};
  if (i < n * cfg().slot[p.r] * 0.6) return {t: "Titolare", c: ""};
  return {t: "Scommessa", c: "muted"};
}
function inflation(pm = priceModel()) {
  const {byId} = players(); let paid = 0, exp = 0, n = 0;
  for (const o of ops()) if (o.tipo === "asta" && byId[o.pid]) { paid += o.prezzo; exp += suggestPrice(byId[o.pid], pm); n++; }
  return {n, paid, exp, ratio: n >= 3 && exp > 0 ? paid / exp : 1};
}

/* ---------- database ---------- */
S._ver = 0;
const writeChains = {};
function save(path, data) {
  if (!S.db) { toast("Database non disponibile: modifica non salvata"); return Promise.resolve(); }
  const prev = writeChains[path] || Promise.resolve();
  const next = prev.catch(() => {}).then(() => S.db.doc(path).set(JSON.parse(JSON.stringify(data)))).catch(e => {
    if (e?.code === "invalid_argument") { S.dbState = "ro"; renderStrip(); toast("Non hai i permessi per modificare questi dati"); }

const num = v => { const x = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(x) ? 0 : x; };

function importQuote(text, removeMissing) {
  const rows = parseRows(text); let hdr = null; const found = new Set();
  const teams = JSON.parse(JSON.stringify(S.teams)); const res = {upd: 0, add: 0, moved: 0, skip: [], removed: 0};

  btn.disabled = true; out.hidden = false; out.textContent = "Claude sta ragionando…";
  try {
    const {truncated} = await S.sample(prompt, {signal: ctl.signal, onText: ({text}) => { (document.getElementById(out.id) || out).textContent = text; }});
    if (truncated) (document.getElementById(out.id) || out).textContent += "\n\n(Risposta interrotta: chiedi di nuovo per il resto.)";
  } catch (e) {
    (document.getElementById(out.id) || out).textContent = (e?.text || "") + (e?.code === "not_granted" ? "\nConsulenza non autorizzata in questa sessione." : e?.code === "rate_limited" ? "\nTroppe richieste: riprova tra un minuto." : e?.code === "cancelled" ? "" : "\nRichiesta non riuscita.");
  } finally { const b2 = document.getElementById(btn.id); if (b2) b2.disabled = false; btn.disabled = false; }
}
function aiBlock(kind, label) {
  if (!S.sample) return "";
  return `<div class="panel"><div class="panel-h"><h3>Parere di Claude</h3><button class="btn" data-ai="${kind}" id="ai-${kind}">${label}</button></div><div class="ai-out note" id="aiout-${kind}" hidden></div><div class="small muted">La richiesta usa il tuo account Claude e solo i dati mostrati qui.</div></div>`;
}

function vFormazione() {
  const c = cfg(); const G = S.ui.formG || currentG(); const saved = S.form[G];
  const mod = saved?.modulo || c.modulo || "3-4-3";
  const f = S.ui.draft && S.ui.draft.g === G ? S.ui.draft : saved || bestXI(mod, G);
  const need = {P: 1, D: MODULI[f.modulo][0], C: MODULI[f.modulo][1], A: MODULI[f.modulo][2]};
  const mine = myPlayers(); const byId = players().byId; const sc = score(f);
  if (!mine.length) return `<div class="empty">Prima registra la tua rosa nella scheda Asta: qui ti proporrò l'undici migliore ogni giornata.</div>`;
  const tit = f.tit.map(id => byId[id]).filter(Boolean);
  const counts = Object.fromEntries(ROLES.map(r => [r, tit.filter(p => p.r === r).length]));
  const bad = ROLES.filter(r => counts[r] !== need[r]);
  const line = r => { const ps = tit.filter(p => p.r === r); const cells = ps.map(p => { const e = vote(p.id, G); const d = sc?.detail.find(x => x.id === p.id); return `<div class="slot"><span class="n">${esc(p.n)}</span><span class="t">${esc(p.sigla)}</span><span class="x">${e ? (e.vo == null ? (d?.sub ? "↔ " + f1(d.fv) : "sv") : f1(e.fv)) : f1(p.atteso)}</span></div>`; }); for (let i = ps.length; i < need[r]; i++) cells.push(`<div class="slot empty-slot"><span class="n">${r}</span></div>`); return `<div class="line">${cells.join("")}</div>`; };
  const expected = tit.reduce((s, p) => s + p.atteso, 0);
  const state = id => f.tit.includes(id) ? "T" : f.pan.includes(id) ? "P" : "X";
  return `
  <section class="panel"><div class="row">
    <div class="field"><label class="lbl" for="fo-g">Giornata</label><input type="number" id="fo-g" min="1" max="38" value="${G}"></div>
    <div class="field"><label class="lbl" for="fo-mod">Modulo</label><select id="fo-mod">${Object.keys(MODULI).map(m => `<option ${m === f.modulo ? "selected" : ""}>${m}</option>`).join("")}</select></div>
    <span class="spacer"></span>
    <button class="btn" id="fo-best">Schiera i migliori</button>
    <button class="btn primary" id="fo-save">${saved ? "Aggiorna formazione" : "Salva formazione"}</button>
  </div>
  <div class="small muted">${saved ? `Formazione salvata per la giornata ${G}.` : "Formazione non ancora salvata."} Il punteggio atteso pesa ultime 3 giornate, fantamedia e quotazione; esclude infortunati e squalificati.</div></section>
  <section class="grid g2">
    <div class="panel" style="gap:10px">
      <div class="panel-h"><h2>${f.modulo}</h2><span>${sc ? `<span class="lbl">Punti G${G}</span> <b style="font-family:var(--display);font-size:1.6rem">${f1(sc.tot)}</b> <span class="small muted">${sc.subs} cambi</span>` : `<span class="lbl">Atteso</span> <b style="font-family:var(--display);font-size:1.6rem">${f1(expected)}</b>`}</span></div>
      ${bad.length ? `<div class="note warn small">Il modulo ${f.modulo} richiede ${ROLES.map(r => `${need[r]}${r}`).join(" ")}: hai ${ROLES.map(r => `${counts[r]}${r}`).join(" ")}.</div>` : ""}
      <div class="pitch">${line("A")}${line("C")}${line("D")}${line("P")}</div>
    </div>

let rq = 0;

function render() {
  const act = document.activeElement; const fid = act && act.id && $("#main").contains(act) ? act.id : null; const sel = fid && "selectionStart" in act ? [act.selectionStart, act.selectionEnd] : null;

  const v = {panoramica: vPanoramica, giocatori: vGiocatori, asta: vAsta, formazione: vFormazione, mercato: vMercato, storico: vStorico, dati: vDati}[S.tab] || vPanoramica;
  const openAi = [...m.querySelectorAll(".ai-out:not([hidden])")].map(e => [e.id, e.textContent]);
  m.innerHTML = banner + v();
  for (const [id, t] of openAi) { const e = document.getElementById(id); if (e) { e.hidden = false; e.textContent = t; } }

/* ---------- eventi ---------- */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button,[data-open],[data-apick],[data-mpick],tr[data-apick]"); if (!t) { if (ev.target.id === "scrim") closeDrawer(); return; }
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; try { localStorage.setItem("fanta.tab", d.tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  if (d.star) { ev.stopPropagation(); const a = asta(); const ob = {...a.obiettivi}; ob[d.star] ? delete ob[d.star] : ob[d.star] = {max: null}; a.obiettivi = ob; await setLega("asta", a); if ($("#scrim")) openDrawer(d.star); return; }

  if (d.undo) { await undoOp(d.undo); return; }
  if (d.goasta) { S.ui.astaPick = d.goasta; S.ui.astaQ = players().byId[d.goasta].n; S.tab = "asta"; closeDrawer(); render(); return; }
  if (d.apick) { S.ui.astaPick = d.apick; S.ui.astaQ = players().byId[d.apick]?.n || ""; render(); window.scrollTo({top: 0, behavior: "smooth"}); return; }
  if (d.mpick) { S.ui.mercPick = d.mpick; S.ui.mercQ = players().byId[d.mpick]?.n || ""; render(); return; }
  if (d.open) { openDrawer(d.open); return; }
  if (d.frole !== undefined) { S.ui.role = d.frole; render(); return; }
  if (d.arole) { S.ui.astaRole = d.arole; render(); return; }
  if (d.sort) { if (S.ui.sort === d.sort) S.ui.dir *= -1; else { S.ui.sort = d.sort; S.ui.dir = ["n", "team"].includes(d.sort) ? 1 : -1; } $("#g-results").innerHTML = gResults(); return; }
  if (d.ai) { ask(d.ai, $("#aiout-" + d.ai), t); return; }
  if (d.fstate) {
    const G = S.ui.formG || currentG(); const base = S.ui.draft && S.ui.draft.g === G ? S.ui.draft : S.form[G] || bestXI(cfg().modulo || "3-4-3", G);
    const f = {...base, tit: base.tit.filter(x => x !== d.fstate), pan: base.pan.filter(x => x !== d.fstate)};
    if (d.k === "T") f.tit.push(d.fstate); if (d.k === "P") f.pan.push(d.fstate);
    S.ui.draft = f; render(); return;
  }
  switch (t.id) {
    case "d-close": closeDrawer(); break;
    case "d-save": { const pid = t.dataset.pid; await updatePlayer(pid, {st: $("#d-st").value, q: Math.max(1, +$("#d-q").value || 1), r: $("#d-r").value, tid: $("#d-t").value}); toast("Giocatore aggiornato"); closeDrawer(); break; }
    case "a-buy": { const pr = +$("#a-price").value; if (!(pr >= 1)) { toast("Inserisci un prezzo di almeno 1"); break; } await buy(S.ui.astaPick, $("#a-by").value, pr, "asta"); S.ui.astaQ = ""; S.ui.astaPick = null; render(); $("#a-q")?.focus(); break; }
    case "a-addopp": { const n = $("#a-opp").value.trim(); if (!n) break; const a = asta(); if (a.avversari.includes(n) || n === ME) { toast("Nome già presente"); break; } a.avversari = [...a.avversari, n]; await setLega("asta", a); break; }
    case "c-save": { const c = cfg(); const nc = {...c, nomeSquadra: $("#c-name").value.trim() || c.nomeSquadra, crediti: +$("#c-cred").value || c.crediti, partecipanti: +$("#c-part").value || c.partecipanti, rimborso: $("#c-rimb").value, slot: Object.fromEntries(ROLES.map(r => [r, Math.max(1, +$("#c-slot-" + r).value || 1)])), perc: Object.fromEntries(ROLES.map(r => [r, Math.max(0, +$("#c-perc-" + r).value || 0)]))}; await setLega("config", nc); toast("Regole salvate"); break; }
    case "fo-best": { const G = S.ui.formG || currentG(); S.ui.draft = bestXI($("#fo-mod").value, G); render(); break; }
    case "fo-save": { const G = S.ui.formG || currentG(); const f = S.ui.draft && S.ui.draft.g === G ? S.ui.draft : S.form[G] || bestXI($("#fo-mod").value, G); if (!S.db) { toast("Database non disponibile"); break; } S.form[G] = {...f, g: G, ts: new Date().toISOString()}; S.ui.draft = null; bump(); await save("formazioni/g" + G, S.form[G]); if (cfg().modulo !== f.modulo) await setLega("config", {...cfg(), modulo: f.modulo}); toast(`Formazione G${G} salvata`); break; }
    case "m-buy": { const pr = Math.max(0, +$("#m-price").value || 0); if (pr > credits(ME)) { toast("Crediti insufficienti"); break; } await buy(S.ui.mercPick, ME, pr, "acquisto"); S.ui.mercPick = null; S.ui.mercQ = ""; render(); break; }
    case "iv-go": { const g = +$("#iv-g").value; if (!(g >= 1 && g <= 38)) { toast("Giornata tra 1 e 38"); break; } const {teams, res} = importVoti($("#iv-t").value, g); await commitTeams(teams); $("#iv-res") && ($("#iv-res").innerHTML = `Giornata ${g}: ${res.ok} voti, ${res.sv} senza voto, ${res.add} giocatori aggiunti.${res.skip.length ? `<br><span style="color:var(--warn)">Non riconosciuti (${res.skip.length}): ${esc(res.skip.slice(0, 30).join(", "))}${res.skip.length > 30 ? "…" : ""}</span>` : ""}`); toast("Voti importati"); break; }
    case "iq-go": { const {teams, res} = importQuote($("#iq-t").value, $("#iq-rm").checked); await commitTeams(teams); $("#iq-res") && ($("#iq-res").innerHTML = `${res.upd} aggiornati (${res.moved} cambi di squadra), ${res.add} nuovi${res.removed ? `, ${res.removed} rimossi` : ""}.${res.skip.length ? `<br><span style="color:var(--warn)">Non riconosciuti (${res.skip.length}): ${esc(res.skip.slice(0, 30).join(", "))}${res.skip.length > 30 ? "…" : ""}</span>` : ""}`); toast("Listone importato"); break; }
    case "b-save": { const c = cfg(); const bonus = Object.fromEntries(Object.keys(c.bonus).map(k => [k, +$("#b-" + k).value || 0])); const g = +$("#b-g").value; await setLega("config", {...c, bonus, giornata: g >= 1 ? g : null}); toast("Impostazioni salvate"); break; }
    case "mv-save": {
      const g = +$("#mv-g").value; if (!(g >= 1 && g <= 38)) { toast("Giornata tra 1 e 38"); break; }
      const b = cfg().bonus; const teams = JSON.parse(JSON.stringify(S.teams));
      for (const p of myPlayers()) {
        const val = k => { const e = document.getElementById(`mv-${k}-${p.id}`); return e ? num(e.value) : 0; };
        const raw = document.getElementById(`mv-vo-${p.id}`).value.trim();
        const e = raw === "" ? {vo: null} : (() => { const vo = num(raw), gf = val("gf"), as = val("as"), am = val("am"), es = val("es"), gs = val("gs"), rp = val("rp"); return {vo, gf, as, am, es, gs, rp, fv: Math.round((vo + gf * b.gol + as * b.ass + am * b.amm + es * b.esp + gs * b.gs + rp * b.rp) * 100) / 100}; })();
        const t = teams[p.tid].giocatori.find(x => x.id === p.id); t.v = {...(t.v || {}), [g]: e};
      }
      await commitTeams(teams); toast(`Voti G${g} salvati`); break;
    }
    case "r-ask": S.ui.confirmReset = true; render(); break;
    case "r-no": S.ui.confirmReset = false; render(); break;
    case "r-yes": S.ui.confirmReset = false; await setLega("asta", {...asta(), presi: {}}); await setLega("movimenti", {ops: []}); toast("Asta azzerata"); break;
  }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "f-q") { S.ui.q = t.value; $("#g-results").innerHTML = gResults(); }
  if (t.id === "a-q") { S.ui.astaQ = t.value; S.ui.astaPick = null; render(); }
  if (t.id === "m-q") { S.ui.mercQ = t.value; S.ui.mercPick = null; render(); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "f-team") { S.ui.team = t.value; $("#g-results").innerHTML = gResults(); }
  if (t.id === "f-own") { S.ui.own = t.value; $("#g-results").innerHTML = gResults(); }
  if (t.id === "fo-g") { const g = +t.value; if (g >= 1 && g <= 38) { S.ui.formG = g; S.ui.draft = null; render(); } }
  if (t.id === "fo-mod") { const G = S.ui.formG || currentG(); S.ui.draft = bestXI(t.value, G); render(); }
  if (t.id === "s-pid") { S.ui.storPid = t.value; render(); }
  if (t.id === "mv-g") { const g = +t.value; if (g >= 1 && g <= 38) { S.ui.manualG = g; render(); } }
});
document.addEventListener("toggle", ev => { const t = ev.target; if (t.tagName === "DETAILS" && t.id) S.ui.open = {...(S.ui.open || {}), [t.id]: t.open}; }, true);
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && $("#scrim")) closeDrawer(); if (ev.key === "Enter" && ev.target.id === "a-opp") $("#a-addopp").click(); });

render(); initDb(); initSample();
</script>
