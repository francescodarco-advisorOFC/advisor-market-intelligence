# Aggiorna il Flusso Notizie ADVISOR e lo pubblica su GitHub Pages.
# Fasce (ora italiana, lun-ven): 8, 10, 12, 15, 17. GitHub ragiona in UTC e non
# conosce l'ora legale, quindi il cron copre entrambi gli scarti e il primo step
# lascia proseguire solo le esecuzioni che cadono vicino a una fascia.
name: Flusso notizie

on:
  schedule:
    - cron: '30 5,6,7,8,9,10,12,13,14,15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        name: Controlla la fascia oraria
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          now=$(TZ=Europe/Rome date +%H:%M); m=$((10#${now%:*} * 60 + 10#${now#*:}))
          run=false
          # Finestra da 30 minuti prima a 40 minuti dopo ogni fascia (i cron di GitHub possono ritardare).
          for t in 480 600 720 900 1020; do
            if [ $m -ge $((t - 30)) ] && [ $m -le $((t + 40)) ]; then run=true; fi
          done
          echo "Ora di Roma $now -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.gate.outputs.run == 'true'
        name: Scarica le notizie e impagina il sito
        run: |
          node scripts/news-snapshot.mjs _site/news.json
          node scripts/build-ui.mjs --static _site
          count=$(node -e "console.log(require('./_site/news.json').items.length)")
          if [ "$count" -lt 20 ]; then echo "::error::Solo $count notizie: pubblicazione annullata"; exit 1; fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
