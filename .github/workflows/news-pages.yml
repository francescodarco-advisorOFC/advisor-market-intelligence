# Aggiorna il Flusso Notizie ADVISOR e lo pubblica su GitHub Pages.
# Fasce (ora italiana, lun-ven) in lib/news/schedule.mjs: 8, 10, 12, 15, 17.
# I cron di GitHub possono ritardare o saltare: per questo il workflow gira ogni
# 15 minuti nella fascia lavorativa e pubblica solo quando, dall'ultima fascia
# iniziata, il sito non è ancora stato aggiornato (scripts/news-due.mjs).
# Un'esecuzione persa viene così recuperata dalla successiva.
name: Flusso notizie

on:
  schedule:
    # 05-16 UTC copre 7-18 a Roma sia con l'ora solare sia con quella legale.
    - cron: '7,22,37,52 5-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: due
        name: Serve un aggiornamento?
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          node scripts/news-due.mjs "https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/news.json"

      - if: steps.due.outputs.due == 'true'
        name: Scarica le notizie e impagina il sito
        run: |
          node scripts/news-snapshot.mjs _site/news.json
          node scripts/build-ui.mjs --static _site
          count=$(node -e "console.log(require('./_site/news.json').items.length)")
          if [ "$count" -lt 20 ]; then echo "::error::Solo $count notizie: pubblicazione annullata"; exit 1; fi

      - if: steps.due.outputs.due == 'true'
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    if: needs.build.outputs.due == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
